name: Fork Client

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      mode:
        description: Verify normally, or preflight/publish the pinned optional APK
        required: true
        default: verify
        type: choice
        options:
          - verify
          - optional-preflight
          - optional-publish
          - optional-reconcile
      source_run_id:
        description: Failed optional push run that got a verified APK receipt before starting a feed write
        type: string
        required: false
      expected_feed_id:
        description: Latest Android feed post ID from the read-only check
        type: string
      expected_feed_sha256:
        description: Exact whole Android feed digest from the read-only check
        type: string
      expected_files_id:
        description: Latest files channel post ID from the read-only check
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'verify'
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Select release mode
        id: mode
        env:
          RELEASE: ${{ contains(github.event.head_commit.message, '[Release]') }}
          OPTIONAL: ${{ contains(github.event.head_commit.message, '[Optional]') }}
        run: |
          mode=ci
          if [[ "$GITHUB_REF" == refs/heads/dev ]]; then
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              mode=verify
            elif [[ "$RELEASE" == true ]]; then
              mode=release
            elif [[ "$OPTIONAL" == true ]]; then
              mode=optional
            fi
          fi
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: nttld/setup-ndk@6a7e9c5494a25c4842ca1011f710300132eacd94 # v1.4.2
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Install native build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
          sudo apt update
          sudo apt -y install ninja-build meson nasm gperf pkg-config unzip
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          rustup toolchain install 1.96.1 -t aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Assemble unsigned APK
        env:
          ADDITIONAL_BUILD: ${{ secrets.ADDITIONAL_BUILD_NUMBER }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          USER_ID_OWNER: ${{ secrets.USER_ID_OWNER }}
          UPDATE_CHANNEL_USERNAME: ${{ secrets.UPDATE_CHANNEL_USERNAME }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          {
            printf '\nDUMMY_CONST=0\norg.gradle.workers.max=1\n'
            printf 'ADDITIONAL_BUILD_NUMBER=%s\n' "$((ADDITIONAL_BUILD / 10000))"
            printf 'USER_REPO=%s\nCHECK_UPDATES=1\n' "$GITHUB_REPOSITORY"
            printf 'APP_ID=%s\nAPP_HASH=%s\n' "${APP_ID:-0}" "${APP_HASH:-0}"
            printf 'USER_ID_OWNER=%s\nUPDATE_CHANNEL_USERNAME=%s\n' "$USER_ID_OWNER" "$UPDATE_CHANNEL_USERNAME"
            printf 'LASTFM_API_KEY=%s\nLASTFM_API_SECRET=%s\n' "$LASTFM_API_KEY" "$LASTFM_API_SECRET"
          } >> gradle.properties
          ./gradlew :TMessagesProj_App:assembleAfatRelease -PunsignedCiRelease=true
      - name: Upload unsigned APK
        if: steps.mode.outputs.mode != 'ci'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unsigned-apk
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  sign:
    name: Sign APK
    needs: build
    if: github.ref == 'refs/heads/dev' && needs.build.outputs.mode != 'ci'
    runs-on: ubuntu-24.04
    environment: android-signing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-unsigned-apk
          path: unsigned
      - name: Align APK and check release metadata
        id: prepare
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -f -P 16 4 unsigned/app.apk "$RUNNER_TEMP/aligned.apk"
          package=$("$tools/aapt2" dump badging "$RUNNER_TEMP/aligned.apk" | sed -n '/^package: /p')
          [[ "$package" == "package: name='org.forkclient.messenger.beta' "* ]]
          version=$(sed -n "s/.* versionName='\([0-9.]*\)'.*/\1/p" <<< "$package")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Sign and verify APK
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          MODE: ${{ needs.build.outputs.mode }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          : "${RELEASE_KEYSTORE_BASE64:?Missing release keystore}" "${ALIAS_NAME:?Missing key alias}"
          : "${ALIAS_PASS:?Missing key password}" "${KEYSTORE_PASS:?Missing keystore password}"
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/release.XXXXXX")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset RELEASE_KEYSTORE_BASE64
          tools="$ANDROID_HOME/build-tools/36.0.0"
          output="$RUNNER_TEMP/verified.apk"
          if [[ "$MODE" != verify ]]; then
            mkdir signed
            output="signed/ForkClient $VERSION.apk"
          fi
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$ALIAS_NAME" \
            --ks-pass env:KEYSTORE_PASS --key-pass env:ALIAS_PASS \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled false --v4-signing-enabled false \
            --out "$output" "$RUNNER_TEMP/aligned.apk"
          rm -f -- "$keystore"
          unset ALIAS_PASS KEYSTORE_PASS ALIAS_NAME
          "$tools/zipalign" -c -P 16 4 "$output"
          certs=$("$tools/apksigner" verify --print-certs "$output")
          fingerprint=$(awk '/^Signer #[0-9]+ certificate SHA-256 digest:/ {print $NF}' <<< "$certs")
          [[ "$fingerprint" == 0880f186d777f3cb6d82a66d02bd58850e3a270a26b678175459a95511235ae5 ]]
          printf 'Verified the existing release certificate for Android %s\n' "$VERSION"
          if [[ "$MODE" != verify ]]; then
            printf '%s\n' "$VERSION" > signed/version.txt
          fi
      - name: Upload signed APK
        if: needs.build.outputs.mode != 'verify'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-signed-apk
          path: signed/
          if-no-files-found: error
          overwrite: true

  publish-telegram:
    name: Publish to Telegram
    needs: [build, sign]
    if: contains(fromJSON('["release", "optional"]'), needs.build.outputs.mode)
    runs-on: ubuntu-24.04
    environment: android-telegram
    concurrency:
      group: fork-client-android-telegram
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-signed-apk
          path: ${{ runner.temp }}/telegram-release
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install uploader dependencies
        if: needs.build.outputs.mode == 'release'
        run: |
          python -m venv "$RUNNER_TEMP/telegram-venv"
          python="$RUNNER_TEMP/telegram-venv/bin/python"
          "$python" -m pip install --require-hashes --only-binary=:all: -r .github/requirements-python-build.txt
          "$python" -m pip install --require-hashes --no-build-isolation -r .github/requirements-upload.txt
      - name: Upload APK and update the feed
        if: needs.build.outputs.mode == 'release'
        env:
          ANDROID_TELEGRAM_SESSION_GZIP_BASE64: ${{ secrets.ANDROID_TELEGRAM_SESSION_GZIP_BASE64 }}
          ANDROID_TELEGRAM_API_ID: ${{ secrets.ANDROID_TELEGRAM_API_ID }}
          ANDROID_TELEGRAM_API_HASH: ${{ secrets.ANDROID_TELEGRAM_API_HASH }}
          FORK_UPLOAD_MODE: ${{ needs.build.outputs.mode }}
        working-directory: ${{ runner.temp }}/telegram-release
        run: |
          VERSION=$(cat version.txt)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          : "${ANDROID_TELEGRAM_SESSION_GZIP_BASE64:?Missing Telegram session}"
          : "${ANDROID_TELEGRAM_API_ID:?Missing Telegram API ID}" "${ANDROID_TELEGRAM_API_HASH:?Missing Telegram API hash}"
          umask 077
          trap 'rm -f -- android-release.session android-release.session-journal android-release.session-shm android-release.session-wal' EXIT
          printf '%s' "$ANDROID_TELEGRAM_SESSION_GZIP_BASE64" | base64 --decode | gzip -dc > android-release.session
          unset ANDROID_TELEGRAM_SESSION_GZIP_BASE64
          "$RUNNER_TEMP/telegram-venv/bin/python" "$GITHUB_WORKSPACE/.github/scripts/publish_android.py" "$FORK_UPLOAD_MODE" "$VERSION"
      - name: Publish optional APK through Bot API
        timeout-minutes: 30
        if: needs.build.outputs.mode == 'optional'
        env:
          ANDROID_BOT_TOKEN: ${{ secrets.ANDROID_BOT_TOKEN }}
          ANDROID_BOT_API_SSH_KEY: ${{ secrets.ANDROID_BOT_API_SSH_KEY }}
          ANDROID_BOT_API_SSH_KNOWN_HOSTS: ${{ vars.ANDROID_BOT_API_SSH_KNOWN_HOSTS }}
        working-directory: ${{ runner.temp }}/telegram-release
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/publish_android_bot_api.sh" "$(cat version.txt)"

  retry-optional:
    name: Recover signed optional APK
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/dev' &&
      (inputs.mode == 'optional-preflight' || inputs.mode == 'optional-publish')
    runs-on: ubuntu-24.04
    environment: android-telegram
    permissions:
      contents: read
      actions: read
    concurrency:
      group: fork-client-android-telegram
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate pinned source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REPOSITORY" == forkgram/TelegramAndroid ]]
          gh api repos/forkgram/TelegramAndroid/actions/artifacts/14998261075 |
            jq -e '.id == 14998261075 and .name == "android-signed-apk" and .expired == false and
              .workflow_run.id == 45557046133 and
              .workflow_run.head_sha == "c056292776c29cac990adf6255e97d199423130a" and
              .digest == "sha256:2a302d1f3a00c65e04ca3810878ffb6e5fc7ff94a29675fd012e0185f4ce7f91"' >/dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: '14998261075'
          merge-multiple: true
          run-id: '45557046133'
          github-token: ${{ github.token }}
          repository: forkgram/TelegramAndroid
          path: ${{ runner.temp }}/telegram-release
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check or publish only the pinned 13.2.5.0 APK
        working-directory: ${{ runner.temp }}/telegram-release
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_FEED_ID: ${{ inputs.expected_feed_id }}
          EXPECTED_FEED_SHA256: ${{ inputs.expected_feed_sha256 }}
          EXPECTED_FILES_ID: ${{ inputs.expected_files_id }}
          ANDROID_BOT_TOKEN: ${{ secrets.ANDROID_BOT_TOKEN }}
          ANDROID_BOT_API_SSH_KEY: ${{ secrets.ANDROID_BOT_API_SSH_KEY }}
          ANDROID_BOT_API_SSH_KNOWN_HOSTS: ${{ vars.ANDROID_BOT_API_SSH_KNOWN_HOSTS }}
        run: |
          [[ "$(cat version.txt)" == 13.2.5.0 ]]
          printf '%s  %s\n' '0cd8bd8b6bfb8be46079894432a707713001c5aec3b8c845b0ec0151cc6b4efc' 'ForkClient 13.2.5.0.apk' | sha256sum -c -
          args=()
          if [[ "$MODE" == optional-preflight ]]; then
            args+=(--preflight)
          else
            [[ "$MODE" == optional-publish ]]
            [[ "$EXPECTED_FEED_ID" =~ ^[1-9][0-9]*$ && "$EXPECTED_FILES_ID" =~ ^[1-9][0-9]*$ && "$EXPECTED_FEED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          fi
          if [[ -n "$EXPECTED_FEED_ID$EXPECTED_FEED_SHA256$EXPECTED_FILES_ID" ]]; then
            args+=(--expected-feed-id "$EXPECTED_FEED_ID" --expected-feed-sha256 "$EXPECTED_FEED_SHA256" --expected-files-id "$EXPECTED_FILES_ID")
          fi
          bash "$GITHUB_WORKSPACE/.github/scripts/publish_android_bot_api.sh" 13.2.5.0 "${args[@]}"


  reconcile-optional:
    name: Reconcile existing optional APK
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/dev' &&
      inputs.mode == 'optional-reconcile'
    runs-on: ubuntu-24.04
    environment: android-telegram
    permissions:
      contents: read
      actions: read
    concurrency:
      group: fork-client-android-telegram
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify original optional run and extract its exact upload receipt
        id: receipt
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          [[ "$GITHUB_REPOSITORY" == forkgram/TelegramAndroid && "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          api="repos/$GITHUB_REPOSITORY"
          run=$(gh api "$api/actions/runs/$SOURCE_RUN_ID")
          jq -e '.path == ".github/workflows/tandroid.yml" and .event == "push" and .head_branch == "dev" and
            .status == "completed" and .conclusion == "failure" and .run_attempt == 1' <<< "$run" >/dev/null
          source_sha=$(jq -er '.head_sha | select(test("^[a-f0-9]{40}$"))' <<< "$run")
          gh api "$api/compare/$source_sha...$GITHUB_SHA" | jq -e '.status == "ahead" or .status == "identical"' >/dev/null
          for file in .github/workflows/tandroid.yml .github/scripts/publish_android_optional.py .github/scripts/publish_android_bot_api.sh; do
            remote_blob=$(gh api "$api/contents/$file?ref=$source_sha" --jq .sha)
            [[ "$remote_blob" == "$(git hash-object -- "$file")" ]]
          done
          jobs=$(gh api "$api/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest")
          jq -e '[.jobs[] | select(.name == "Sign APK" and .conclusion == "success")] | length == 1' <<< "$jobs" >/dev/null
          job=$(jq -er '[.jobs[] | select(.name == "Publish to Telegram" and .conclusion == "failure")] |
            select(length == 1) | .[0].id | tostring | select(test("^[1-9][0-9]*$"))' <<< "$jobs")
          artifact=$(gh api "$api/actions/runs/$SOURCE_RUN_ID/artifacts" | jq -er \
            --arg sha "$source_sha" --argjson run "$SOURCE_RUN_ID" \
            '[.artifacts[] | select(.name == "android-signed-apk" and .expired == false and
              .workflow_run.id == $run and .workflow_run.head_sha == $sha and
              (.digest | test("^sha256:[a-f0-9]{64}$")))] |
              select(length == 1) | .[0].id | tostring | select(test("^[1-9][0-9]*$"))')
          umask 077
          logs=$(mktemp "$RUNNER_TEMP/android-receipt.XXXXXX")
          trap 'rm -f -- "$logs"' EXIT
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --job "$job" --log-failed > "$logs"
          version=$(python .github/scripts/read_android_optional_receipt.py "$logs" "$RUNNER_TEMP/android-receipt.json")
          expected_title="[Optional] ${version%.*}."
          [[ "$(jq -er '.head_commit.message | split("\n")[0]' <<< "$run")" == "$expected_title" ]]
          printf 'artifact=%s\nrun=%s\n' "$artifact" "$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.receipt.outputs.artifact }}
          merge-multiple: true
          run-id: ${{ steps.receipt.outputs.run }}
          github-token: ${{ github.token }}
          repository: forkgram/TelegramAndroid
          path: ${{ runner.temp }}/telegram-release
      - name: Update only the Android feed for that exact existing APK
        timeout-minutes: 10
        working-directory: ${{ runner.temp }}/telegram-release
        env:
          ANDROID_BOT_TOKEN: ${{ secrets.ANDROID_BOT_TOKEN }}
          ANDROID_BOT_API_SSH_KEY: ${{ secrets.ANDROID_BOT_API_SSH_KEY }}
          ANDROID_BOT_API_SSH_KNOWN_HOSTS: ${{ vars.ANDROID_BOT_API_SSH_KNOWN_HOSTS }}
        run: |
          receipt="$RUNNER_TEMP/android-receipt.json"
          version=$(jq -er .version "$receipt")
          digest=$(jq -er .apk_sha256 "$receipt")
          apk_id=$(jq -er .apk_id "$receipt")
          [[ "$(cat version.txt)" == "$version" ]]
          printf '%s  %s\n' "$digest" "ForkClient $version.apk" | sha256sum -c -
          bash "$GITHUB_WORKSPACE/.github/scripts/publish_android_bot_api.sh" "$version" \
            --expected-feed-id "$(jq -er .feed_id "$receipt")" \
            --expected-feed-sha256 "$(jq -er .feed_sha256 "$receipt")" \
            --expected-files-id "$apk_id" --reconcile-apk-id "$apk_id"

  attest:
    name: Attest release APK
    needs: [build, sign]
    if: needs.build.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-signed-apk
          path: signed
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: signed/*.apk

  release:
    name: Create GitHub release draft
    needs: [sign, publish-telegram, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-signed-apk
          path: signed
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat signed/version.txt)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release create "$VERSION" "signed/ForkClient $VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "ForkClient $VERSION" \
            --notes "— Updated to ${VERSION%.*} build of the official Telegram."
