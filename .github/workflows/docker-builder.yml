name: Build & Push Docker Builder Image

on:
  push:
    paths:
      - 'docker/Dockerfile'
      - '.github/workflows/docker-builder.yml'
      - 'TMessagesProj/jni/boringssl'
      - 'TMessagesProj/jni/ffmpeg'
      - 'TMessagesProj/jni/libvpx'
      - 'TMessagesProj/jni/dav1d'
      - 'TMessagesProj/jni/tde2e_source'
      - 'TMessagesProj/jni/patches/**'
      - 'TMessagesProj/jni/build_*.sh'
      - 'TMessagesProj/jni/prepare.py'
      - 'TMessagesProj/jni/CMakeLists.txt'
      - 'TMessagesProj/jni/voip/**'
    branches:
      - dev
  schedule:
    - cron: '0 3 1-7 * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Lowercase image name
        id: lower
        run: echo "image_name=$(echo '${{ github.repository }}/forkgram-builder' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.image_name }}:latest
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.image_name }}:${{ github.sha }}
